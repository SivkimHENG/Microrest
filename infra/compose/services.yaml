    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:5003/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.menu-service.rule=PathPrefix(`/api/v1/menu`)"
      - "traefik.http.services.menu-service.loadbalancer.server.port=5003"
